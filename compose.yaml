name: panora-demo

# No named volumes: Postgres runs on tmpfs, so every recreate starts from empty databases.
# `npm run dev` starts only the infrastructure; the `apps` profile also runs every app in a container.

x-app: &app
  profiles: [apps]
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - type: bind
        source: ./infra/postgres/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        read_only: true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  mcp-extranet:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP: mcp-extranet
    environment:
      MCP_EXTRANET_PORT: 3002
    ports:
      - '${MCP_EXTRANET_PORT:-3002}:3002'
    healthcheck: &app-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  simulator:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP: simulator
    environment:
      SIMULATOR_PORT: 3003
    ports:
      - '${SIMULATOR_PORT:-3003}:3003'
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]

  agents:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
      args:
        APP: agents
    environment:
      MASTRA_PORT: 4111
      MASTRA_HOST: 0.0.0.0
    ports:
      - '${MASTRA_PORT:-4111}:4111'
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4111/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
