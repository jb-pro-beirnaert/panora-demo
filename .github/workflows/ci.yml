name: CI

# Manual only: no automatic runs on push or pull request.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only secrets: the real ones never reach CI.
  CORE_SERVICE_TOKEN: ci-core-service-token-0123456789
  MCP_TOKEN_SECRET: ci-mcp-token-secret-0123456789-0123456789
  ADMIN_TOKEN: ci-admin-token-0123456789
  INBOUND_EMAIL_TOKEN: ci-inbound-email-token-0123456789
  MASTRA_API_TOKEN: ci-mastra-api-token-0123456789

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration and isolation tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
